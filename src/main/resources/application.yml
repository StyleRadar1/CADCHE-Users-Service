server:
  port: ${SERVER_PORT:8120}

spring:
  application:
    name: ms-usuarios

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    user:
      name: ${INTERNAL_AUTH_USERNAME}
      password: "{noop}${INTERNAL_AUTH_PASSWORD}"

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/styleradar_usuarios}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

styleradar:
  catalogo:
    base-url: ${CATALOGO_API_BASE_URL:https://rst-itemcatalog-service-qa.redwave-74d6e30f.northcentralus.azurecontainerapps.io}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info

