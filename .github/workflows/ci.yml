name: CI - Usuarios

on:
  push:
    branches-ignore:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Tests y Analisis Estatico
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: styleradar_usuarios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d styleradar_usuarios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/styleradar_usuarios
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          for attempt in 1 2 3; do
            log_file=$(mktemp)
            if ./mvnw -B clean verify >"$log_file" 2>&1; then
              cat "$log_file"
              rm -f "$log_file"
              exit 0
            else
              mvn_status=$?
            fi

            cat "$log_file"
            if ! grep -q 'status code: 429' "$log_file" || [ "$attempt" -eq 3 ]; then
              rm -f "$log_file"
              exit "$mvn_status"
            fi

            delay=$((attempt * 20))
            echo "Maven Central respondió 429; se reintentará en ${delay}s (intento $((attempt + 1))/3)."
            rm -f "$log_file"
            sleep "$delay"
          done

      - name: Analisis estatico con SpotBugs
        run: >
          ./mvnw -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          -Dspotbugs.excludeFilterFile=spotbugs-exclude.xml

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Guardar JAR validado para Docker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ms-usuarios-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Preparar archivos de analisis SonarQube
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-input
          path: target/
          if-no-files-found: error

  sonar:
    name: Analisis de codigo con SonarQube Cloud
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Descargar clases y reporte de pruebas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sonar-input
          path: target

      - name: Analisis de codigo con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            log_file=$(mktemp)
            if ./mvnw -B \
              org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
              -Dsonar.projectKey=StyleRadar1_CADCHE-Users-Service >"$log_file" 2>&1; then
              cat "$log_file"
              rm -f "$log_file"
              exit 0
            else
              mvn_status=$?
            fi

            cat "$log_file"
            if ! grep -q 'status code: 429' "$log_file" || [ "$attempt" -eq 3 ]; then
              rm -f "$log_file"
              exit "$mvn_status"
            fi

            delay=$((attempt * 20))
            echo "Maven Central respondió 429; se reintentará en ${delay}s (intento $((attempt + 1))/3)."
            rm -f "$log_file"
            sleep "$delay"
          done

  docker-build-check:
    name: Validar construccion de la imagen Docker
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Descargar JAR validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ms-usuarios-jar
          path: .

      - name: Construir imagen sin publicarla
        run: |
          cp ms-usuarios-*.jar app.jar
          docker build -f Dockerfile.runtime -t ms-usuarios:pr-check .
