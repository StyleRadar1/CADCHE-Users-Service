name: CI/CD QA - Usuarios

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Tests y Analisis Estatico
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: styleradar_usuarios
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d styleradar_usuarios"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/styleradar_usuarios
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: postgres
        run: |
          for attempt in 1 2 3; do
            log_file=$(mktemp)
            if ./mvnw -B clean verify >"$log_file" 2>&1; then
              cat "$log_file"
              rm -f "$log_file"
              exit 0
            else
              mvn_status=$?
            fi

            cat "$log_file"
            if ! grep -q 'status code: 429' "$log_file" || [ "$attempt" -eq 3 ]; then
              rm -f "$log_file"
              exit "$mvn_status"
            fi

            delay=$((attempt * 20))
            echo "Maven Central respondió 429; se reintentará en ${delay}s (intento $((attempt + 1))/3)."
            rm -f "$log_file"
            sleep "$delay"
          done

      - name: Analisis estatico con SpotBugs
        run: >
          ./mvnw -B
          com.github.spotbugs:spotbugs-maven-plugin:4.8.6.6:check
          -Dspotbugs.excludeFilterFile=spotbugs-exclude.xml

      - name: Guardar reporte JaCoCo
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reporte-jacoco
          path: target/site/jacoco/
          if-no-files-found: warn

      - name: Guardar JAR validado para Docker
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ms-usuarios-jar
          path: target/*.jar
          if-no-files-found: error

      - name: Preparar archivos de analisis SonarQube
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-input
          path: target/
          if-no-files-found: error

  sonar:
    name: Analisis de codigo con SonarQube Cloud
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Configurar Java 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Descargar clases y reporte de pruebas
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sonar-input
          path: target

      - name: Analisis de codigo con SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          for attempt in 1 2 3; do
            log_file=$(mktemp)
            if ./mvnw -B \
              org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
              -Dsonar.projectKey=StyleRadar1_CADCHE-Users-Service \
              -Dsonar.qualitygate.wait=true \
              -Dsonar.qualitygate.timeout=300 >"$log_file" 2>&1; then
              cat "$log_file"
              rm -f "$log_file"
              exit 0
            else
              mvn_status=$?
            fi

            cat "$log_file"
            if ! grep -q 'status code: 429' "$log_file" || [ "$attempt" -eq 3 ]; then
              rm -f "$log_file"
              exit "$mvn_status"
            fi

            delay=$((attempt * 20))
            echo "Maven Central respondió 429; se reintentará en ${delay}s (intento $((attempt + 1))/3)."
            rm -f "$log_file"
            sleep "$delay"
          done

  publish-image:
    name: Construir y publicar imagen
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      contents: read
      id-token: write
    needs: [build, sonar]

    steps:
      - name: Descargar codigo
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Descargar JAR validado
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ms-usuarios-jar
          path: .

      - name: Preparar JAR para Docker
        run: cp ms-usuarios-*.jar app.jar

      - name: Autenticarse en Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Iniciar sesion en Azure Container Registry
        run: az acr login --name styleradarusersacr

      - name: Construir y publicar imagen Docker
        env:
          ACR_LOGIN_SERVER: styleradarusersacr.azurecr.io
        run: |
          docker build -f Dockerfile.runtime \
            -t "$ACR_LOGIN_SERVER/ms-usuarios:$GITHUB_SHA" \
            -t "$ACR_LOGIN_SERVER/ms-usuarios:qa" \
            .

          docker push "$ACR_LOGIN_SERVER/ms-usuarios:$GITHUB_SHA"
          docker push "$ACR_LOGIN_SERVER/ms-usuarios:qa"

  deploy-qa:
    name: Desplegar en Azure App Service QA
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    permissions:
      id-token: write
    needs: publish-image

    steps:
      - name: Autenticarse en Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Desplegar imagen en QA
        env:
          ACR_LOGIN_SERVER: styleradarusersacr.azurecr.io
        run: |
          az webapp config container set \
            --name styleradar-qa-app \
            --resource-group styleradar-qa-rg \
            --docker-custom-image-name "$ACR_LOGIN_SERVER/ms-usuarios:$GITHUB_SHA" \
            --docker-registry-server-url "https://$ACR_LOGIN_SERVER"

          az webapp config appsettings set \
            --name styleradar-qa-app \
            --resource-group styleradar-qa-rg \
            --settings \
              WEBSITES_PORT=8120 \
              FLYWAY_ENABLED=true \
              SPRING_PROFILES_ACTIVE=qa

          az webapp restart \
            --name styleradar-qa-app \
            --resource-group styleradar-qa-rg

  smoke-qa:
    name: Smoke Test en Azure QA
    runs-on: ubuntu-latest
    needs: deploy-qa

    steps:
      - name: Verificar health y OpenAPI en QA
        env:
          BASE_URL: https://styleradar-qa-app.azurewebsites.net
        run: |
          for attempt in $(seq 1 30); do
            health=$(curl -s -o /dev/null -w '%{http_code}' "$BASE_URL/actuator/health" || true)
            if [[ "$health" == "200" ]]; then
              echo "Health respondió 200 en el intento $attempt."
              break
            fi
            echo "Health respondió $health (intento $attempt/30); se reintenta en 10s."
            sleep 10
          done
          if [[ "$health" != "200" ]]; then
            echo "El servicio no quedó saludable tras el despliegue."
            exit 1
          fi
          docs="000"
          for attempt in $(seq 1 3); do
            docs=$(curl --connect-timeout 10 --max-time 45 -sS \
              -o /dev/null -w '%{http_code}' "$BASE_URL/v3/api-docs" || true)
            if [[ "$docs" == "200" ]]; then
              echo "OpenAPI respondió 200 en el intento $attempt."
              break
            fi
            echo "OpenAPI respondió $docs (intento $attempt/3); se reintenta en 10s."
            if [[ "$attempt" -lt 3 ]]; then sleep 10; fi
          done
          if [[ "$docs" != "200" ]]; then
            echo "OpenAPI no quedó disponible después de 3 intentos."
            exit 1
          fi
